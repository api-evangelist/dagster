apis:
- aid: dagster:graphql-api
  name: Dagster GraphQL API
  description: >-
    The Dagster GraphQL API allows clients to interact with Dagster programmatically. It can be used to
    query information about Dagster runs, retrieve metadata about repositories, jobs, and ops, and launch
    runs. The GraphQL endpoint is served by the webserver at the /graphql route.
  humanURL: https://docs.dagster.io/api/graphql
  tags:
  - Data Orchestration
  - GraphQL
  - Jobs
  - Runs
  - Workflows
